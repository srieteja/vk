version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: enterprise_db
    environment:
      POSTGRES_USER: srie
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: vk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: