services:
  postgres:
    image: postgres:15-alpine
    container_name: vk_db_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwerty}
      POSTGRES_DB: ${POSTGRES_DB:-vk_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srie} -d ${POSTGRES_DB:-vk_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: vk_redis_container
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Emulates the Stripe API for local/CI testing without a real Stripe
  # account. Point STRIPE_SECRET_KEY at any sk_test_* value and configure
  # the stripe-go client's base URL to http://localhost:12111 to use it
  # (see https://github.com/stripe/stripe-mock). Not used by default --
  # PAYMENT_PROVIDER=fake covers local dev without needing this container.
  stripe-mock:
    image: stripe/stripe-mock:latest
    container_name: vk_stripe_mock
    ports:
      - "12111:12111"
      - "12112:12112"

volumes:
  postgres_data:
